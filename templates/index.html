<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Face Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="text-center mb-4">Library Self-Service Face Kiosk</h2>
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card shadow-sm p-3 mb-4">
                    <img src="{{ url_for('video_feed') }}" class="img-fluid rounded mb-3" style="max-height: 400px;">
                    <button class="btn btn-primary btn-lg" onclick="triggerScan()">Scan My Face</button>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm p-4" id="result-card">
                    <h4>Student Information</h4>
                    <hr>
                    <div id="student-info">
                        <p class="text-muted">Align your face with the camera and click scan.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function triggerScan() {
            const infoDiv = document.getElementById('student-info');
            infoDiv.innerHTML = `<p class="text-info">Scanning face, please hold still...</p>`;
            
            fetch('/scan_face', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        let booksHtml = data.books.length > 0 ? 
                            `<table class="table table-sm mt-3">
                                <thead><tr><th>Book</th><th>Due Date</th><th>Fine</th></tr></thead>
                                <tbody>` + 
                                data.books.map(b => `<tr><td>${b.title}</td><td>${b.due_date}</td><td>$${b.fine}</td></tr>`).join('') +
                                `</tbody></table>` : 
                            `<p class="text-success mt-3">No active borrowed books.</p>`;

                        infoDiv.innerHTML = `
                            <h5>Welcome, <strong>${data.student_name}</strong></h5>
                            <p class="mb-1">Roll Number: ${data.roll_number}</p>
                            <p class="text-danger fw-bold">Total Overdue Fine: $${data.total_fine}</p>
                            <h6 class="mt-3">Borrowed Books:</h6>
                            ${booksHtml}
                        `;
                    } else {
                        infoDiv.innerHTML = `<p class="text-danger">${data.message}</p>`;
                    }
                })
                .catch(err => {
                    infoDiv.innerHTML = `<p class="text-danger">An error occurred during scanning.</p>`;
                });
        }
    </script>
</body>
</html>
